[project]
name = "bpmn-refine"
version = "0.1.0"
description = "Interactive BPMN validation, repair, and refinement with LLMs"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSING.md"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.15.0",
    "anthropic>=0.40.0",
    "openai>=1.54.0",
    "google-genai>=0.3.0",
    "lxml>=5.3.0",
    "pyyaml>=6.0.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "pm4py>=2.7.22.3",
    # Woflan's place-invariant LP falls back to scipy without it, which pm4py
    # itself calls unstable — tier 2 decides dataset membership, so it must be exact
    "pulp>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "lxml-stubs>=0.5.1",
]

[project.scripts]
bpmn-refine = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# source is in backend/ so point hatch at the actual package root
packages = ["backend/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests", "evaluation/tests"]
# the generator lives outside backend/ and imports app.*, so both roots are needed
pythonpath = ["backend", "."]
