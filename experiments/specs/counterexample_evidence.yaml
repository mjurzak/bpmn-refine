# Phase 3c. Tier 2 runs in both conditions — only the counterexample traces are
# withheld, otherwise this would confound "evidence helps" with "checking helps"
experiment_id: counterexample-evidence
notes: >-
  Does handing the model a formal counterexample improve repair, holding the
  checker and its verdict fixed.

inputs:
  - data/test_cases/*.bpmn
  - data/rule_cases/*.broken.bpmn

exclude:
  # duplicate xsd:IDs are rejected at parse time, so this never reaches a tier
  - data/test_cases/02_duplicate_ids.bpmn

base:
  model_tier: strong
  repair_mode: atomic
  max_repair_iters: 5
  tiers_enabled: { t1: true, t2: true, t3: false }
  t2_tools: [woflan]

axes:
  include_formal_evidence: [true, false]

repeats: 3
