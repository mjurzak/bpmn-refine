notes: >-
  E5 resource-constrained screening. Twenty fixed cases receive the
  deterministic-only, holistic-LLM-only, and combined pipelines. Only the two
  holistic configurations call Terra, for 40 provider calls. The panel was
  selected by a salted stable hash before any E5 outputs were inspected.
