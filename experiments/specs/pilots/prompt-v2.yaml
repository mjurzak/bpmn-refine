experiment_id: prompt-v2-pilot
dataset_version: v1.0+ground-truth-overlay-1.1
inputs:
- data/eval/v1.0/seeds/18.bpmn
- data/eval/v1.0/seeds/19.bpmn
- data/eval/v1.0/seeds/20.bpmn
- data/eval/v1.0/variants/single/M01/33.bpmn
- data/eval/v1.0/variants/single/M02/09.bpmn
- data/eval/v1.0/variants/single/M03/17.bpmn
- data/eval/v1.0/variants/single/M04/17.bpmn
- data/eval/v1.0/variants/single/M05/48.bpmn
- data/eval/v1.0/variants/single/M06/45.bpmn
- data/eval/v1.0/variants/single/M07/34.bpmn
description_root: data/eval/v1.0/descriptions
base:
  model_tier: custom
  model_override: gpt-5.6-terra
  provider_override: codex_cli
  ir_format: pydantic
  tiers_enabled:
    t1: false
    t2: false
    t3: true
  llm_validation_scope: semantic
  include_semantic_projection: true
  reasoning_effort: medium
run_repair: false
configs:
- provider_override: claude_cli
  model_override: claude-sonnet-5
  reasoning_effort: null
repeats: 1
notes: >-
  Preregistered prompt-v2 gate. Three unadjudicated seed candidates probe
  speculative findings; one variant per M01-M07 probes taxonomy and evidence.
  Do not treat seed findings as false positives until human adjudication.
  Full E1 rerun is allowed only if both providers have no schema/errors, improve
  target-category detection (especially M03 and M06), and materially reduce
  unsupported findings on all three seed candidates.
