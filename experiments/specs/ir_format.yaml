# Phase 3c. Five serialisations under identical conditions; each trial records
# prompt chars, input tokens and `input_bytes` so cost is comparable, not just quality
experiment_id: ir-format
notes: >-
  Repair quality and token cost per IR surface. Tiers are pinned so the only
  thing varying is how the diagram is presented to the model.

inputs:
  - data/test_cases/*.bpmn
  - data/rule_cases/*.broken.bpmn

exclude:
  # rejected by the canonical model at parse time; see counterexample_evidence.yaml
  - data/test_cases/02_duplicate_ids.bpmn

base:
  model_tier: strong
  repair_mode: atomic
  max_repair_iters: 5
  tiers_enabled: { t1: true, t2: true, t3: false }

axes:
  ir_format:
    - pydantic
    - pydantic_json
    - yaml
    - mermaid
    - compact_json

# compared on the distribution, since the model itself varies between runs
repeats: 3
